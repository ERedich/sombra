services:
  postgres:
    image: postgres:16-alpine
    container_name: sombra-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: cmms
      POSTGRES_PASSWORD: cmms
      POSTGRES_DB: sombra
    volumes:
      - sombra_pgdata:/var/lib/postgresql/data

volumes:
  sombra_pgdata:
